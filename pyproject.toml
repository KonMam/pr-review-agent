[project]
name = "pr-review"
version = "0.1.0"
description = "Precision-first PR reviewer for Go, with an offline eval"
readme = "README.md"
authors = [
    { name = "Konstantinas Mamonas", email = "k.mamonas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.46.0",
    "pydantic>=2.14.3",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[project.scripts]
pr-review = "pr_review.cli:main"
